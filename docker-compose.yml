# Source checkout deployment.
services:
  homectl:
    build:
      context: .
      args:
        VERSION: dev
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./deploy/server/config.json:/app/config.json:ro
      - ./data:/data
    ports:
      - "127.0.0.1:8080:8080"

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      - homectl
    network_mode: "service:homectl"
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token
      - PASTE_YOUR_CLOUDFLARE_TUNNEL_TOKEN_HERE
