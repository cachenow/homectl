services:
  homectl:
    image: __IMAGE__:__TAG__
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./config.json:/app/config.json:ro
      - ./data:/data
    ports:
      - "127.0.0.1:8080:8080"

  cloudflared:
    image: cloudflare/cloudflared:2026.8.3@sha256:51c9cefcb4569df44e1ad403ab1d3d8065aa8e84339bcfc6aee75502e1140339
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      - homectl
    network_mode: "service:homectl"
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token
      - PASTE_YOUR_CLOUDFLARE_TUNNEL_TOKEN_HERE
