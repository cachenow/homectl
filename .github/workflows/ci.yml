name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true

      - name: Resolve modules
        run: go mod tidy

      - name: Format check
        run: |
          test -z "$(gofmt -l cmd internal)" || {
            echo "Go files are not gofmt formatted:"
            gofmt -l cmd internal
            exit 1
          }

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build server
        run: CGO_ENABLED=0 go build -trimpath ./cmd/server

      - name: Build agent
        run: CGO_ENABLED=0 go build -trimpath ./cmd/agent
